[package]
name = "hearken-mcp"
version = "0.1.0"
edition = "2021"
description = "Read-only MCP server exposing Hearken meetings, transcripts and action items to MCP clients (Claude Desktop, Claude Code)"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["rt", "macros", "io-std", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
