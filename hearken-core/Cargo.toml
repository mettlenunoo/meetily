[package]
name = "hearken-core"
version = "0.1.0"
edition = "2021"
description = "Logic shared by the Hearken app and hearken-mcp: evidence-grounded meeting items and the meeting.md export"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.32.0", features = ["rt", "macros"] }
